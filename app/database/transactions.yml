increments: false

columns:
  id:
    type: uuid
    primary: true
  booking_id:
    type: uuid
    index: true
  type:
    type: string
    length: 30
  amount:
    type: integer
  currency:
    type: string
    length: 3
    default: USD
  status:
    type: string
    length: 20
  platform_fee:
    type: integer
    default: 0
  stripe_payment_intent_id:
    type: string
    length: 255
    nullable: true

timestamps: true

seeds:
  count: 0