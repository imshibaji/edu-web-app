increments: false

columns:
  id:
    type: uuid
    primary: true
  email:
    type: string
    length: 255
    unique: true
  password_hash:
    type: string
    length: 255
  role:
    type: string
    length: 10
    default: STUDENT
  is_active:
    type: boolean
    default: true
  base_currency:
    type: string
    length: 3
    default: USD
  remember_token:
    type: string
    length: 100
    nullable: true

timestamps: true

